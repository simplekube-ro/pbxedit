name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: swift test (macOS)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Performance (release build)
        run: swift test -c release --filter PerformanceTests
  oracle:
    name: oracle (xcodebuild -list on post-operation fixtures)
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      ORACLE_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Select the newest Xcode on the image
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          echo "Selecting $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          swift --version
      - name: Oracle
        run: swift test --filter 'CLITests.OracleTests|CLITests.OracleGateTests'
