name: Release

# Task 4.1 of release-distribution. Placeholders to replace once the owner
# decides (tasks 1.1, 1.3): TOOL_NAME `pbxedit`, the tap `simplekube-ro/homebrew-tap`.
# Safe YAML: no untrusted event field is interpolated into a run: line; the
# tag reaches the shell through the TAG environment variable only.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

env:
  TOOL_NAME: pbxedit                          # placeholder: public name (task 1.1)

jobs:
  test:
    name: swift test (macOS)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Performance (release build)
        run: swift test -c release --filter PerformanceTests

  oracle:
    name: oracle (xcodebuild -list on post-operation fixtures)
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      ORACLE_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode on the image
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          echo "Selecting $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          swift --version
      - name: Oracle
        run: swift test --filter 'CLITests.OracleTests|CLITests.OracleGateTests'

  release:
    name: build, verify and publish
    needs: [test, oracle]
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      TAG: ${{ github.ref_name }}             # read from $TAG in the shell, never interpolated
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag against Version.swift (design D1)
        run: |
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::tag '$TAG' is not vMAJOR.MINOR.PATCH"; exit 1;;
          esac
          VERSION="${TAG#v}"
          BASE="$(grep -oE 'static let base = "[^"]+"' Sources/pbxedit/Version.swift | sed -E 's/.*"([^"]+)"$/\1/')"
          echo "tag=$TAG version=$VERSION Version.swift=$BASE"
          if [ "${BASE%-dev}" != "$VERSION" ]; then
            echo "::error::Version.swift says '$BASE' but the tag is '$TAG'; bump Version.swift first (docs/RELEASING.md § 1)"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "ARCHIVE=$TOOL_NAME-$VERSION-macos-universal.tar.gz" >> "$GITHUB_ENV"

      - name: Set the release version (drops -dev)
        run: |
          sed -i '' -E "s/static let base = \"[^\"]+\"/static let base = \"$VERSION\"/" Sources/pbxedit/Version.swift
          grep -q "static let base = \"$VERSION\"" Sources/pbxedit/Version.swift
          git diff -- Sources/pbxedit/Version.swift

      - name: Build universal (design D2)
        run: |
          swift --version
          swift build -c release --arch arm64 --arch x86_64 --product pbxedit
          BIN="$(swift build -c release --arch arm64 --arch x86_64 --product pbxedit --show-bin-path)/pbxedit"
          test -x "$BIN"
          echo "BIN=$BIN" >> "$GITHUB_ENV"

      - name: Assert architectures, minimum OS and version (D2, D6, D1)
        run: |
          ARCHS="$(lipo -archs "$BIN" | tr ' ' '\n' | sort | tr '\n' ' ')"
          echo "lipo -archs: $ARCHS"
          [ "$ARCHS" = "arm64 x86_64 " ] || { echo "::error::expected arm64 and x86_64, got '$ARCHS'"; exit 1; }
          otool -l "$BIN" | grep -A4 LC_BUILD_VERSION
          MINOS="$(otool -l "$BIN" | awk '/LC_BUILD_VERSION/{f=1} f && /minos/{print $2; f=0}')"
          [ "$(echo "$MINOS" | wc -l | tr -d ' ')" = "2" ] || { echo "::error::expected two LC_BUILD_VERSION commands (one per slice)"; exit 1; }
          if echo "$MINOS" | grep -vqx '13.0'; then echo "::error::a slice has minos other than 13.0 (Package.swift declares macOS 13)"; exit 1; fi
          REPORTED="$("$BIN" --version)"
          [ "$REPORTED" = "$VERSION" ] || { echo "::error::--version printed '$REPORTED', expected '$VERSION'"; exit 1; }

      - name: Package
        run: |
          mkdir -p dist/stage
          cp "$BIN" dist/stage/pbxedit
          tar -czf "dist/$ARCHIVE" -C dist/stage pbxedit
          (cd dist && shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256" && shasum -a 256 -c "$ARCHIVE.sha256")
          cat "dist/$ARCHIVE.sha256"
          tar -tzf "dist/$ARCHIVE"

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" "dist/$ARCHIVE" "dist/$ARCHIVE.sha256" \
            --title "$TOOL_NAME $VERSION" --generate-notes --verify-tag

      - name: Check out the tap
        uses: actions/checkout@v4
        with:
          repository: simplekube-ro/homebrew-tap   # placeholder: tap repository (task 1.3)
          token: ${{ secrets.TAP_TOKEN }}
          path: tap

      - name: Update the formula (url, sha256)
        run: |
          FORMULA="tap/Formula/$TOOL_NAME.rb"
          test -f "$FORMULA"
          SUM="$(cut -d' ' -f1 "dist/$ARCHIVE.sha256")"
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$ARCHIVE"
          sed -i '' -E "s|^  url \".*\"$|  url \"$URL\"|" "$FORMULA"
          sed -i '' -E "s|^  sha256 \".*\"$|  sha256 \"$SUM\"|" "$FORMULA"
          grep -q "url \"$URL\"" "$FORMULA"
          grep -q "sha256 \"$SUM\"" "$FORMULA"
          git -C tap diff

      - name: Install and test the formula against the published release
        run: |
          brew install --formula "./tap/Formula/$TOOL_NAME.rb"
          [ "$("$(brew --prefix)/bin/$TOOL_NAME" --version)" = "$VERSION" ]
          brew test "$TOOL_NAME"
          brew audit --strict --formula "./tap/Formula/$TOOL_NAME.rb" || true   # advisory until the tap has been audited once

      - name: Commit and push the tap
        run: |
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Formula/$TOOL_NAME.rb"
          git commit -m "$TOOL_NAME $VERSION"
          git push
