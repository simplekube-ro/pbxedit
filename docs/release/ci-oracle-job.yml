# Task 3.2 of release-distribution: add this job under `jobs:` in
# .github/workflows/ci.yml, then mark "oracle (xcodebuild -list on
# post-operation fixtures)" as a required status check in branch protection.
# The existing "Oracle" step in the `test` job becomes redundant (the full
# `swift test` there still runs the suite); remove it or keep it.

  oracle:
    name: oracle (xcodebuild -list on post-operation fixtures)
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      ORACLE_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode on the image
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          echo "Selecting $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          swift --version
      - name: Oracle
        run: swift test --filter 'CLITests.OracleTests|CLITests.OracleGateTests'
